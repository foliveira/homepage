        <style>
            :root {
                --bg: #f6f7f8;
                --fg: #0b0b0c;
                --muted: #5e626a;
                --accent: #0e62f6;
                --accent-weak: rgba(14, 98, 246, 0.06);
                --card: #ffffffcc;
                --border: #e6e7ea;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0b0b0c;
                    --fg: #e9eaec;
                    --muted: #a0a6af;
                    --accent: #76a7ff;
                    --accent-weak: rgba(118, 167, 255, 0.08);
                    --card: #111215cc;
                    --border: #1e2026;
                }
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                background: radial-gradient(
                        1200px 800px at 50% -20%,
                        var(--accent-weak),
                        transparent 70%
                    )
                    var(--bg);
                color: var(--fg);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Helvetica,
                    Arial,
                    "Apple Color Emoji",
                    "Segoe UI Emoji",
                    "Noto Color Emoji";
                line-height: 1.5;
                min-height: 100vh;
                display: grid;
                place-items: center;
            }

            main {
                width: 100%;
                max-width: 760px;
                padding: 24px;
            }

            .card {
                border: 1px solid var(--border);
                background: var(--card);
                -webkit-backdrop-filter: saturate(140%) blur(8px);
                backdrop-filter: saturate(140%) blur(8px);
                border-radius: 16px;
                padding: clamp(24px, 4vw, 48px);
                box-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.04),
                    0 6px 24px rgba(0, 0, 0, 0.06);
            }

            h1 {
                margin: 0 0 12px;
                font-weight: 800;
                letter-spacing: -0.02em;
                font-size: clamp(36px, 7vw, 64px);
                line-height: 1.1;
            }

            p.lead {
                margin: 0 0 24px;
                color: var(--muted);
                font-size: clamp(16px, 2.5vw, 18px);
            }

            nav {
                margin-top: 8px;
            }

            ul.links {
                display: flex;
                flex-wrap: wrap;
                gap: 12px 18px;
                padding: 0;
                margin: 0;
                list-style: none;
            }

            .links a {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                color: var(--fg);
                text-decoration: none;
                border: 1px solid var(--border);
                padding: 10px 14px;
                border-radius: 999px;
                transition:
                    border-color 0.2s ease,
                    color 0.2s ease,
                    background 0.2s ease,
                    transform 0.06s ease;
                background: transparent;
            }
            .links a:hover {
                color: var(--accent);
                border-color: var(--accent);
                background: var(--accent-weak);
                transform: translateY(-1px);
            }
            .links a:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .links a img,
            .links a svg {
                display: block;
                width: 18px;
                height: 18px;
            }

            footer {
                margin-top: 20px;
                color: var(--muted);
                font-size: 14px;
            }

            @media (prefers-reduced-motion: reduce) {
                .links a {
                    transition: none;
                }
            }
        </style>
    </head>
